<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebSocket Chatroom Demo</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="auth-shell">
    <section class="panel auth-panel">
        <h1>Go WebSocket Chatroom Demo</h1>
        <p class="hint">创建账号后返回登录</p>
        <form id="registerForm" class="auth-form">
            <input name="username" type="text" placeholder="用户名" autocomplete="username" required>
            <input name="password" type="password" placeholder="密码" autocomplete="new-password" required>
            <button type="submit">注册</button>
        </form>
        <p id="message" class="form-message"></p>
        <p class="hint">已有账号？<a href="/login">去登录</a></p>
    </section>
</main>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const message = document.getElementById('message');
        const submitButton = form.querySelector('button[type="submit"]');
        const body = {
            username: form.username.value.trim(),
            password: form.password.value,
        };

        if (!body.username || !body.password) {
            message.textContent = '请填写用户名和密码';
            return;
        }

        message.textContent = '正在注册...';
        submitButton.disabled = true;

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            if (response.ok) {
                message.textContent = '注册成功，请登录';
                setTimeout(() => { window.location.href = '/login'; }, 600);
                return;
            }

            const data = await response.json().catch(() => ({}));
            message.textContent = data.error === 'user already exists' ? '该用户名已被注册' : (data.error || '注册失败，请稍后再试');
        } catch {
            message.textContent = '网络异常，注册失败';
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
