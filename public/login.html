<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebSocket Chatroom Demo</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="auth-shell">
    <section class="panel auth-panel">
        <h1>Go WebSocket Chatroom Demo</h1>
        <p class="hint">登录后进入聊天室</p>
        <form id="loginForm" class="auth-form">
            <input name="username" type="text" placeholder="用户名（3-20位，字母数字下划线）" autocomplete="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_\-]+" title="只允许字母、数字、下划线、短横线">
            <input name="password" type="password" placeholder="密码（至少6位）" autocomplete="current-password" required minlength="6">
            <button type="submit">登录</button>
        </form>
        <p id="message" class="form-message"></p>
        <p class="hint">没有账号？<a href="/register">去注册</a></p>
    </section>
</main>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const message = document.getElementById('message');
        const submitButton = form.querySelector('button[type="submit"]');
        const username = form.username.value.trim();
        const password = form.password.value;

        if (!username || !password) {
            message.textContent = '请填写用户名和密码';
            return;
        }

        if (username.length < 3 || username.length > 20) {
            message.textContent = '用户名长度应为 3-20 位';
            return;
        }

        if (!/^[a-zA-Z0-9_\-]+$/.test(username)) {
            message.textContent = '用户名只允许字母、数字、下划线、短横线';
            return;
        }

        if (password.length < 6) {
            message.textContent = '密码至少需要 6 位';
            return;
        }

        message.textContent = '正在登录...';
        submitButton.disabled = true;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            if (response.ok) {
                window.location.href = '/';
                return;
            }

            const data = await response.json().catch(() => ({}));
            message.textContent = data.error === 'invalid username or password' ? '用户名或密码不正确' : (data.error || '登录失败，请稍后再试');
        } catch {
            message.textContent = '网络异常，登录失败';
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
